<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>礼包兑换助手</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { width: 480px; max-height: 600px; font-family: -apple-system, "Microsoft YaHei", sans-serif; font-size: 13px; }
  .container { padding: 12px; display: flex; flex-direction: column; gap: 10px; }
  h2 { font-size: 14px; color: #333; padding-bottom: 6px; border-bottom: 1px solid #eee; }
  .section { display: flex; flex-direction: column; gap: 6px; }
  .header-row { display: flex; justify-content: space-between; align-items: center; }
  .btn { padding: 4px 10px; border: 1px solid #ccc; background: #fff; border-radius: 4px; cursor: pointer; font-size: 12px; }
  .btn:hover { background: #f5f5f5; }
  .btn-primary { background: #4a90d9; color: #fff; border-color: #4a90d9; }
  .btn-primary:hover { background: #3a7bc8; }
  .btn-danger { color: #c0392b; border-color: #e0a098; }
  textarea { width: 100%; height: 80px; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-family: monospace; font-size: 12px; resize: vertical; }
  .accounts-table { max-height: 140px; overflow-y: auto; border: 1px solid #eee; border-radius: 4px; }
  table { width: 100%; border-collapse: collapse; font-size: 12px; }
  th, td { padding: 4px 6px; text-align: left; border-bottom: 1px solid #f0f0f0; }
  th { background: #fafafa; position: sticky; top: 0; font-weight: 600; }
  .row-actions button { padding: 2px 6px; font-size: 11px; border: none; background: transparent; cursor: pointer; color: #c0392b; }
  .log-area { height: 160px; }
  .log-entry { white-space: pre-wrap; }
  .log-info { color: #333; }
  .log-warn { color: #e67e22; }
  .log-error { color: #c0392b; }
  .log-skip { color: #7f8c8d; }
  .controls { display: flex; gap: 6px; align-items: center; }
  .controls label { font-size: 12px; color: #666; }
  .status { padding: 6px 10px; background: #f8f9fa; border-radius: 4px; font-size: 12px; color: #666; }
  .status.running { background: #d4edda; color: #155724; }
  .add-row input { width: 40%; padding: 3px 6px; border: 1px solid #ccc; border-radius: 3px; font-size: 12px; }
  .hidden { display: none; }
  .import-export { display: flex; gap: 4px; }
  input[type="file"] { display: none; }
</style>
</head>
<body>
<div class="container">

  <div class="section">
    <h2>账号列表</h2>
    <div class="header-row">
      <div class="import-export">
        <button class="btn" id="btnImportAccounts">导入 JSON</button>
        <input type="file" id="fileAccounts" accept=".json">
        <button class="btn" id="btnExportAccounts">导出 JSON</button>
      </div>
      <span id="accountCount" style="color:#666;font-size:12px;">0 个账号</span>
    </div>
    <div class="add-row" style="display:flex;gap:4px;">
      <input type="text" id="newFid" placeholder="账户ID (e.g. 66666666)">
      <input type="text" id="newKid" placeholder="王国ID (e.g. 6666)" style="width:20%;">
      <input type="text" id="newName" placeholder="名称 (e.g. 牛不牛)">
      <button class="btn btn-primary" id="btnAddAccount">添加</button>
    </div>
    <div class="accounts-table">
      <table>
        <thead><tr><th style="width:35%;">fid</th><th style="width:20%;">kid</th><th>名称</th><th style="width:20px;"></th></tr></thead>
        <tbody id="accountsBody"></tbody>
      </table>
    </div>
  </div>

  <div class="section">
    <h2>CDK 列表（每行一个）</h2>
    <textarea id="cdkInput" placeholder="周末愉快&#10;WJDR666"></textarea>
  </div>

  <div class="section">
    <h2>配置</h2>
    <div class="controls">
      <label>Salt:</label>
      <input type="text" id="saltInput" style="flex:1;padding:3px 6px;border:1px solid #ccc;border-radius:3px;font-size:12px;">
      <label style="margin-left:8px;">间隔(秒):</label>
      <input type="number" id="intervalInput" value="5" min="0" max="60" style="width:50px;padding:3px 6px;border:1px solid #ccc;border-radius:3px;font-size:12px;">
    </div>
  </div>

  <div class="section">
    <div class="controls">
      <button class="btn btn-primary" id="btnStart">开始兑换</button>
      <button class="btn btn-danger hidden" id="btnStop">停止</button>
      <button class="btn" id="btnClearLog">清空日志</button>
      <button class="btn" id="btnExportRecords">导出记录</button>
      <div class="status" id="statusBar">就绪</div>
    </div>
  </div>

  <div class="section">
    <h2>运行日志</h2>
    <div class="log-area" id="logArea"></div>
  </div>

</div>

<script src="md5.js"></script>
<script src="popup.js"></script>
</body>
</html>
